<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>duckdb-graph viewer</title>

    <!--
      Cytoscape.js is loaded from a pinned CDN below. To run fully offline,
      vendor it locally: download the pinned file next to this index.html, e.g.

        curl -L https://unpkg.com/cytoscape@3.30.2/dist/cytoscape.min.js \
          -o examples/graph-viewer/cytoscape.min.js

      then point the <script src> at the local copy:

        <script src="cytoscape.min.js"></script>

      The viewer makes no other network calls; it only fetches graph.json
      from the same folder.
    -->
    <script src="https://unpkg.com/cytoscape@3.30.2/dist/cytoscape.min.js"></script>

    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #1b1b1b;
      }
      #app {
        display: grid;
        grid-template-columns: 260px 1fr;
        height: 100vh;
      }
      #sidebar {
        padding: 16px;
        overflow-y: auto;
        border-right: 1px solid #ddd;
        background: #fafafa;
      }
      #sidebar h1 {
        font-size: 16px;
        margin: 0 0 4px;
      }
      #sidebar p.hint {
        font-size: 12px;
        color: #666;
        margin: 0 0 16px;
      }
      #sidebar h2 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #555;
        margin: 18px 0 8px;
      }
      .filter {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        padding: 2px 0;
        cursor: pointer;
      }
      .filter input {
        cursor: pointer;
      }
      .swatch {
        width: 14px;
        height: 14px;
        border-radius: 3px;
        flex: 0 0 auto;
        border: 1px solid rgba(0, 0, 0, 0.2);
      }
      .swatch.edge {
        height: 4px;
        border-radius: 2px;
      }
      #cy {
        width: 100%;
        height: 100%;
      }
      #status {
        font-size: 12px;
        color: #666;
        margin-top: 18px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <h1>duckdb-graph viewer</h1>
        <p class="hint">
          Click a node to expand its one-hop neighbourhood. Drag to pan, scroll
          to zoom.
        </p>

        <h2>Node kinds</h2>
        <div id="node-filters"></div>

        <h2>Edge kinds</h2>
        <div id="edge-filters"></div>

        <h2>Legend</h2>
        <div id="legend"></div>

        <div id="status"></div>
      </aside>
      <main id="cy"></main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
